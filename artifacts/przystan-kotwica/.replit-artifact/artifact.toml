kind = "web"
previewPath = "/"
title = "Przystań Kotwica"
description = "Cinematic one-page website for Przystań Kotwica by Zalew Rybnicki, showcasing water equipment rentals, marina atmosphere, smoked fish and local contact details."
version = "1.0.0"
id = "artifacts/przystan-kotwica"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22269

[services.development]
run = "pnpm --filter @workspace/przystan-kotwica run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/przystan-kotwica", "run", "build" ]
serve = "static"
publicDir = "artifacts/przystan-kotwica/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22269"
BASE_PATH = "/"
